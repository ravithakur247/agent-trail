[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrail"
version = "0.1.0"
description = "See what your AI coding agents are actually doing on your machine — fully local, no telemetry."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AgentTrail contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
    "watchdog>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
agenttrail = "agenttrail.cli:main"

[project.urls]
Homepage = "https://github.com/agenttrail/agenttrail"
Issues = "https://github.com/agenttrail/agenttrail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrail"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
